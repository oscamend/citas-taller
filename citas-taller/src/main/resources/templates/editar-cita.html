<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Editar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .container { width: 100%; padding: 15px; }
        .card { max-width: 650px; margin: 0 auto; }
        /* Mejora el padding en móviles */
        .card-body { padding: 1.5rem !important; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container px-4">
        <a class="navbar-brand fw-bold fs-4 m-0" href="/citas">
            <i class="bi bi-wrench-adjustable-circle-fill text-warning me-1"></i> Volver al Panel
        </a>
    </div>
</nav>

<div class="container mt-2">

    <div th:if="${error}" class="alert alert-danger shadow-sm fw-bold mb-3" th:text="${error}"></div>

    <div class="card shadow-sm border-0 mb-3 bg-white">
        <div class="card-body py-2 px-3 d-flex flex-wrap align-items-center justify-content-between bg-light text-secondary rounded">
            <span class="small fw-bold py-1">
                <i class="bi bi-person-fill text-primary me-1"></i> Cliente:
                <span class="text-dark" th:text="${cliente.nombre + ' ' + cliente.apellido}"></span>
            </span>
            <span class="small fw-bold py-1">
                <i class="bi bi-card-text me-1"></i> DNI:
                <span class="text-dark font-monospace" th:text="${cliente.dni}"></span>
            </span>
        </div>
    </div>

    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i> Editar Cita</h4>
        </div>
        <div class="card-body">

            <form th:action="@{/citas/actualizar}" method="post">
                <input type="hidden" name="id" th:value="${cita.id}">
                <input type="hidden" name="clienteId" th:value="${cliente.id}">

                <div class="row">
                    <div class="col-12 col-sm-6 mb-3">
                        <label for="marca" class="form-label small fw-bold text-secondary">Vehículo</label>
                        <input type="text" class="form-control" id="marca" name="marca" th:value="${cita.marca}" required>
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label for="matricula" class="form-label small fw-bold text-secondary">Matrícula</label>
                        <input type="text" class="form-control text-uppercase" id="matricula" name="matricula" th:value="${cita.matricula}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12 col-sm-6 mb-3">
                        <label for="tipoService" class="form-label small fw-bold text-secondary">Tipo de Servicio</label>
                        <select class="form-select" id="tipoService" name="tipoService" required>
                            <option value="Revisión" th:selected="${cita.tipoService == 'Revisión'}">Revisión General</option>
                            <option value="Mecánica" th:selected="${cita.tipoService == 'Mecánica'}">Fallo de Mecánica</option>
                            <option value="Chapa y Pintura" th:selected="${cita.tipoService == 'Chapa y Pintura'}">Chapa y Pintura</option>
                            <option value="Electricidad" th:selected="${cita.tipoService == 'Electricidad'}">Sistema Eléctrico</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-6 mb-3">
                        <label for="mecanicoId" class="form-label small fw-bold text-secondary">Mecánico</label>
                        <select class="form-select" id="mecanicoId" name="mecanicoId" required>
                            <option th:each="mec : ${mecanicos}"
                                    th:value="${mec.id}"
                                    th:text="${mec.nombre + ' ' + mec.apellido}"
                                    th:selected="${cita.mecanico != null && mec.id == cita.mecanico.id}">
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="fechaHora" class="form-label small fw-bold text-secondary">Fecha y Hora</label>
                    <input type="datetime-local" class="form-control" id="fechaHora" name="fechaHora" th:value="${cita.fechaHora}" required>
                </div>

                <div class="mb-3">
                    <label for="descripcionAveria" class="form-label small fw-bold text-secondary">Descripción</label>
                    <textarea class="form-control" id="descripcionAveria" name="descripcionAveria" rows="3" required th:text="${cita.descripcionAveria}"></textarea>
                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 mt-4">
                    <a href="/citas" class="btn btn-secondary w-100">Cancelar</a>
                    <button type="submit" class="btn btn-primary fw-bold w-100">
                        <i class="bi bi-save me-1"></i> Actualizar
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
