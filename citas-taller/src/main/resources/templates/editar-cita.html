<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Cita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container px-4">
        <a class="navbar-brand fw-bold fs-4 m-0" href="/citas">
            <i class="bi bi-wrench-adjustable-circle-fill text-warning me-1"></i> Volver al Panel
        </a>
    </div>
</nav>

<div class="container mt-4" style="max-width: 650px;">

    <div th:if="${error}" class="alert alert-danger shadow-sm fw-bold mb-3" th:text="${error}"></div>

    <div class="card shadow-sm border-0 mb-3 bg-white">
        <div class="card-body py-2 px-3 d-flex align-items-center justify-content-between bg-light text-secondary rounded">
            <span class="small fw-bold">
                <i class="bi bi-person-fill text-primary me-1"></i> Cliente:
                <span class="text-dark" th:text="${cliente.nombre + ' ' + cliente.apellido}">Juan Pérez</span>
            </span>
            <span class="small fw-bold">
                <i class="bi bi-card-text me-1"></i> DNI:
                <span class="text-dark font-monospace" th:text="${cliente.dni}">12345678X</span>
            </span>
        </div>
    </div>

    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i> Modificar Datos de la Cita</h4>
        </div>
        <div class="card-body p-4">

            <form th:action="@{/citas/actualizar}" method="post">

                <input type="hidden" name="id" th:value="${cita.id}">
                <input type="hidden" name="clienteId" th:value="${cliente.id}">

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="marca" class="form-label small fw-bold text-secondary">Vehículo (Marca / Modelo)</label>
                        <input type="text" class="form-control" id="marca" name="marca" th:value="${cita.marca}" required placeholder="Ej: Seat Ibiza">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="matricula" class="form-label small fw-bold text-secondary">Matrícula</label>
                        <input type="text" class="form-control font-monospace text-uppercase" id="matricula" name="matricula" th:value="${cita.matricula}" required placeholder="Ej: 1234BBB">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="tipoService" class="form-label small fw-bold text-secondary">Tipo de Servicio</label>
                        <select class="form-select" id="tipoService" name="tipoService" required>
                            <option value="Revisión" th:selected="${cita.tipoService == 'Revisión' || cita.tipoService == 'Revisión General'}">Revisión General</option>
                            <option value="Mecánica" th:selected="${cita.tipoService == 'Mecánica' || cita.tipoService == 'Mecánica Motor' || cita.tipoService == 'Cambio de Aceite' || cita.tipoService == 'Frenos'}">Fallo de Mecánica</option>
                            <option value="Chapa y Pintura" th:selected="${cita.tipoService == 'Chapa y Pintura' || cita.tipoService == 'Neumáticos'}">Chapa y Pintura</option>
                            <option value="Electricidad" th:selected="${cita.tipoService == 'Electricidad'}">Sistema Eléctrico</option>
                        </select>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="mecanicoId" class="form-label small fw-bold text-secondary">Mecánico Asignado</label>
                        <select class="form-select" id="mecanicoId" name="mecanicoId" required>
                            <option value="" disabled th:selected="${cita.mecanico == null}">-- Selecciona un mecánico --</option>
                            <option th:each="mec : ${mecanicos}"
                                    th:value="${mec.id}"
                                    th:text="${mec.nombre + ' ' + mec.apellido}"
                                    th:selected="${cita.mecanico != null && mec.id == cita.mecanico.id}">
                                Nombre del Mecánico
                            </option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="fechaHora" class="form-label small fw-bold text-secondary">Fecha y Hora de la Cita</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                        <input type="datetime-local" class="form-control" id="fechaHora" name="fechaHora" th:value="${cita.fechaHora}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="descripcionAveria" class="form-label small fw-bold text-secondary">Descripción de la Avería / Comentarios</label>
                    <textarea class="form-control" id="descripcionAveria" name="descripcionAveria" rows="3" required placeholder="Describe brevemente los síntomas del vehículo..." th:text="${cita.descripcionAveria}"></textarea>
                </div>

                <div class="d-flex justify-content-between mt-4">
                    <a href="/citas" class="btn btn-secondary btn-sm fw-medium">
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary btn-sm fw-bold">
                        <i class="bi bi-save me-1"></i> Actualizar Cita
                    </button>
                </div>
            </form>

        </div>
    </div>
</div>

</body>
</html>
