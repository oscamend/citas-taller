<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container px-4">
        <a class="navbar-brand fw-bold fs-4 m-0" href="/citas">
            <i class="bi bi-arrow-return-left text-warning me-1"></i> Volver a Citas
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <div class="navbar-nav ms-auto gap-2">
                <button type="button" class="btn btn-sm btn-outline-warning d-flex align-items-center gap-1" data-bs-toggle="modal" data-bs-target="#modalCambiarMiPassword">
                    <i class="bi bi-shield-lock"></i> Mi Contraseña
                </button>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${exitoUsuario}" class="alert alert-success shadow-sm mb-3" th:text="${exitoUsuario}"></div>
    <div th:if="${errorUsuario}" class="alert alert-danger shadow-sm mb-3" th:text="${errorUsuario}"></div>

    <div class="card shadow-sm p-4 bg-white border-0 mb-4">
        <h4 class="fw-bold text-dark mb-4 d-flex align-items-center gap-2">
            <i class="bi bi-shield-lock text-primary"></i> Gestión de Cuentas de Acceso
        </h4>

        <div sec:authorize="hasRole('ROLE_ADMIN')" class="card bg-light border-0 p-3 mb-4">
            <h6 class="fw-bold mb-3 text-success"><i class="bi bi-person-plus-fill"></i> Registrar Nuevo Usuario</h6>
            <form th:action="@{/usuarios/guardar}" method="post" class="row g-2 align-items-end">
                <div class="col-md-3"><label class="small fw-bold text-secondary">Usuario</label><input type="text" name="username" class="form-control form-control-sm" required></div>
                <div class="col-md-3"><label class="small fw-bold text-secondary">Contraseña</label><input type="password" name="password" class="form-control form-control-sm" required></div>
                <div class="col-md-3"><label class="small fw-bold text-secondary">Rol</label><select name="role" class="form-select form-select-sm"><option value="ROLE_USER">Mecánico</option><option value="ROLE_ADMIN">Administrador</option></select></div>
                <div class="col-md-3"><button type="submit" class="btn btn-sm btn-success w-100 fw-bold">Crear Cuenta</button></div>
            </form>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-dark small text-uppercase">
                    <tr><th>ID</th><th>Usuario</th><th>Rol</th><th class="text-center">Estado</th><th class="text-center">Acciones</th></tr>
                </thead>
                <tbody class="table-group-divider small">
                    <tr th:each="user : ${usuarios}">
                        <td th:text="${user.id}" class="fw-bold text-secondary"></td>
                        <td th:text="${user.username}"></td>
                        <td>
                            <span th:if="${user.role == 'ROLE_ADMIN'}" class="badge bg-danger">Admin</span>
                            <span th:if="${user.role == 'ROLE_USER'}" class="badge bg-info">Mecánico</span>
                        </td>
                        <td class="text-center"><span class="badge bg-success-subtle text-success">Activo</span></td>
                        <td class="text-center">
                            <div th:if="${user.username != #authentication.name}" class="d-flex justify-content-center gap-1">
                                <button sec:authorize="hasRole('ROLE_ADMIN')" class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" th:data-bs-target="'#modalEditar-' + ${user.id}"><i class="bi bi-pencil-fill"></i></button>
                                <button sec:authorize="hasRole('ROLE_ADMIN')" class="btn btn-sm btn-outline-warning" data-bs-toggle="modal" th:data-bs-target="'#modalReset-' + ${user.id}"><i class="bi bi-key-fill"></i></button>
                                <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/usuarios/eliminar/{id}(id=${user.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Seguro?')"><i class="bi bi-trash3-fill"></i></a>
                            </div>
                            <span th:if="${user.username == #authentication.name}" class="text-muted small"><i class="bi bi-lock-fill"></i> Cuenta Actual</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:each="user : ${usuarios}" sec:authorize="hasRole('ROLE_ADMIN')">
    <div th:if="${user.username != #authentication.name}" class="modal fade" th:id="'modalEditar-' + ${user.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Editar Usuario</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form th:action="@{/usuarios/actualizar}" method="post"><div class="modal-body"><input type="hidden" name="id" th:value="${user.id}"><input type="text" name="username" class="form-control mb-2" th:value="${user.username}" required><select name="role" class="form-select"><option value="ROLE_USER" th:selected="${user.role == 'ROLE_USER'}">Mecánico</option><option value="ROLE_ADMIN" th:selected="${user.role == 'ROLE_ADMIN'}">Administrador</option></select></div><div class="modal-footer"><button type="submit" class="btn btn-primary">Guardar</button></div></form></div></div>
    </div>
    <div th:if="${user.username != #authentication.name}" class="modal fade" th:id="'modalReset-' + ${user.id}" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Nueva Contraseña</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form th:action="@{/usuarios/cambiar-password}" method="post"><div class="modal-body"><input type="hidden" name="id" th:value="${user.id}"><input type="password" name="password" class="form-control" placeholder="Nueva contraseña" required></div><div class="modal-footer"><button type="submit" class="btn btn-warning">Actualizar</button></div></form></div></div>
    </div>
</div>

<div class="modal fade" id="modalCambiarMiPassword" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">Cambiar mi Contraseña</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><form th:action="@{/usuarios/cambiar-mi-password}" method="post"><div class="modal-body"><input type="password" name="passwordActual" class="form-control mb-2" placeholder="Actual" required><input type="password" name="nuevaPassword" class="form-control" placeholder="Nueva" required></div><div class="modal-footer"><button type="submit" class="btn btn-primary">Actualizar</button></div></form></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
