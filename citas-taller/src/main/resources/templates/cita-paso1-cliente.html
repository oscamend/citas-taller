<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Paso 1: Identificar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Ajuste para que el contenedor sea fluido */
        .container {
            width: 100%;
            padding-right: 15px;
            padding-left: 15px;
        }
        /* Aseguramos que la tarjeta no sobresalga en móviles pequeños */
        .card {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4 mt-md-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Agendar Cita - Paso 1: Cliente</h4>
        </div>
        <div class="card-body">
            <form th:action="@{/citas/verificar-cliente}" method="post">
                <div class="mb-3">
                    <label for="dni" class="form-label">DNI / NIE del Cliente</label>
                    <input type="text" class="form-control" id="dni" name="dni"
                           th:value="${dni}" th:readonly="${mostrarRegistro}" required placeholder="Ej: 12345678X">
                </div>

                <div th:if="${mostrarRegistro}">
                    <div class="alert alert-warning py-2 small">El cliente no está registrado. Introduce sus datos:</div>

                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>
                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellidos</label>
                        <input type="text" class="form-control" id="apellido" name="apellido" required>
                    </div>
                    <div class="mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="tel" class="form-control" id="telefono" name="telefono" required>
                    </div>
                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 mt-4">
                    <a th:href="@{/citas}" class="btn btn-secondary w-100">Cancelar</a>
                    <button type="submit" class="btn btn-success w-100">
                        <span th:text="${mostrarRegistro} ? 'Registrar y Continuar' : 'Verificar DNI'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
