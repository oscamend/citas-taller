<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .container { width: 100%; padding: 15px; }
        .card { max-width: 500px; margin: 0 auto; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card shadow-sm border-0">
        <div class="card-header bg-primary text-white py-3">
            <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i> Modificar Cliente</h4>
        </div>
        
        <div class="card-body p-4">
            <div th:if="${errorDniDuplicado}" class="alert alert-danger shadow-sm mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorDniDuplicado}"></span>
            </div>
            <div th:if="${errorClienteDuplicado}" class="alert alert-danger shadow-sm mb-3">
                <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${errorClienteDuplicado}"></span>
            </div>

            <form th:action="@{/clientes/actualizar}" th:object="${cliente}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="mb-3">
                    <label for="nombre" class="form-label small fw-bold text-secondary">Nombre</label>
                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required>
                </div>

                <div class="mb-3">
                    <label for="apellido" class="form-label small fw-bold text-secondary">Apellido</label>
                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required>
                </div>

                <div class="mb-3">
                    <label for="dni" class="form-label small fw-bold text-secondary">DNI</label>
                    <input type="text" class="form-control" id="dni" th:field="*{dni}" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label small fw-bold text-secondary">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" th:field="*{telefono}" placeholder="Ej: 600000000">
                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-between gap-2 mt-4">
                    <a href="/clientes" class="btn btn-secondary w-100">Cancelar</a>
                    <button type="submit" class="btn btn-primary fw-bold w-100">
                        <i class="bi bi-save me-1"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
