<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Mantiene la tabla como está en PC. Si quieres ajustar algo en móvil, usa esto: */
        @media (max-width: 991px) {
            .table { font-size: 0.8rem; }
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container px-4">
        <a class="navbar-brand fw-bold fs-4 m-0" href="/citas">
            <i class="bi bi-wrench-adjustable-circle-fill text-warning me-1"></i> Panel de Citas del Taller
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <div class="navbar-nav ms-auto gap-2">
                <a sec:authorize="hasRole('ADMIN')" href="/mecanicos" class="nav-link btn btn-sm btn-outline-success">
                    <i class="bi bi-person-badge-fill"></i> Gestionar Mecánicos
                </a>
                <a sec:authorize="hasRole('ADMIN')" href="/clientes" class="nav-link btn btn-sm btn-outline-info">
                    <i class="bi bi-person-lines-fill"></i> Gestionar Clientes
                </a>
                <a sec:authorize="hasRole('ADMIN')" href="/usuarios" class="nav-link btn btn-sm btn-outline-warning">
                    <i class="bi bi-people-fill"></i> Gestionar Usuarios
                </a>
                <button type="button" class="nav-link btn btn-sm btn-outline-light" data-bs-toggle="modal" data-bs-target="#modalPassword">
                    <i class="bi bi-shield-lock-fill text-warning"></i> Mi Clave
                </button>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="nav-link btn btn-sm btn-outline-danger">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${error}" class="alert alert-danger shadow-sm fw-bold mb-3" th:text="${error}"></div>
    <div th:if="${exito}" class="alert alert-success shadow-sm fw-bold mb-3" th:text="${exito}"></div>

    <div class="card shadow-sm p-4 mb-4 bg-white border-0">
        <div class="d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
            <div>
                <h4 class="fw-bold mb-1 text-dark">Asistente de Citas</h4>
                <p class="text-muted small mb-0">Registra y gestiona las citas del taller.</p>
            </div>
            <a th:href="@{/citas/nuevo-cliente}" class="btn btn-dark fw-bold px-4 py-2">
                <i class="bi bi-plus-circle-fill text-warning me-2"></i>Agendar Nueva Cita
            </a>
        </div>
    </div>

    <div class="card shadow-sm p-4 bg-white border-0 mb-5">
        <h3 class="mb-4 fw-bold text-dark"><i class="bi bi-list-task text-primary"></i> Historial</h3>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-dark small">
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>DNI</th>
                        <th>Vehículo</th>
                        <th>Matrícula</th>
                        <th>Servicio</th>
                        <th>Fecha</th>
                        <th>Mecánico</th>
                        <th sec:authorize="hasRole('ADMIN')" class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody class="table-group-divider small">
                    <tr th:each="cita : ${citas}">
                        <td th:text="${cita.id}"></td>
                        <td th:text="${cita.cliente != null} ? ${cita.cliente.nombre + ' ' + cita.cliente.apellido} : 'N/A'"></td>
                        <td th:text="${cita.cliente != null} ? ${cita.cliente.dni} : '-'"></td>
                        <td th:text="${cita.marca}"></td>
                        <td><span class="badge bg-secondary" th:text="${cita.matricula}"></span></td>
                        <td th:text="${cita.tipoService}"></td>
                        <td th:text="${#temporals.format(cita.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
                        <td th:text="${cita.mecanico != null} ? ${cita.mecanico.nombre} : 'Sin asignar'"></td>
                        <td sec:authorize="hasRole('ADMIN')" class="text-center">
                            <a th:href="@{/citas/editar/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
