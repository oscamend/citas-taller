<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* CSS para que la tabla se comporte mejor en móvil */
        @media (max-width: 768px) {
            .table thead { display: none; }
            .table, .table tbody, .table tr, .table td { display: block; width: 100%; }
            .table tr { margin-bottom: 15px; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; background: #fff; }
            .table td { text-align: right; padding-left: 50%; position: relative; border: none; }
            .table td::before { content: attr(data-label); position: absolute; left: 10px; font-weight: bold; }
        }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid px-2 px-md-4">
    <div class="card shadow-sm p-3 mb-4 bg-white border-0">
        <div class="d-flex flex-column flex-sm-row align-items-center justify-content-between gap-3">
            <h4 class="fw-bold m-0"><i class="bi bi-calendar-plus-fill text-warning me-2"></i>Citas</h4>
            <a th:href="@{/citas/nuevo-cliente}" class="btn btn-dark w-100 w-sm-auto fw-bold">
                <i class="bi bi-plus-circle-fill text-warning me-2"></i>Nueva Cita
            </a>
        </div>
    </div>

    <form th:action="@{/citas}" method="get" class="row g-2 mb-4 bg-white p-3 rounded shadow-sm">
        <div class="col-12 col-md-3">
            <input type="text" name="dni" th:value="${paramDni}" class="form-control form-control-sm" placeholder="DNI...">
        </div>
        <div class="col-12 col-md-3">
            <input type="text" name="matricula" th:value="${paramMatricula}" class="form-control form-control-sm" placeholder="Matrícula...">
        </div>
        <div class="col-12 col-md-3">
            <button type="submit" class="btn btn-sm btn-primary w-100 fw-bold">Filtrar</button>
        </div>
        <div class="col-12 col-md-3">
            <a href="/citas" class="btn btn-sm btn-outline-secondary w-100">Limpiar</a>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Cliente</th>
                    <th>Matrícula</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cita : ${citas}">
                    <td data-label="Cliente" th:text="${cita.cliente != null} ? ${cita.cliente.nombre} : 'N/A'"></td>
                    <td data-label="Matrícula" th:text="${cita.matricula}"></td>
                    <td data-label="Fecha" th:text="${#temporals.format(cita.fechaHora, 'dd/MM HH:mm')}"></td>
                    <td data-label="Acciones" class="text-end">
                        <a th:href="@{/citas/editar/{id}(id=${cita.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
