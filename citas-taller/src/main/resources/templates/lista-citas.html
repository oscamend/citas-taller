<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Citas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        /* Ajuste para que la tabla no se rompa pero sea legible */
        @media (max-width: 768px) {
            .table-responsive { overflow-x: auto; }
            .table { font-size: 0.85rem; }
        }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container px-4">
        <a class="navbar-brand fw-bold fs-4 m-0" href="/citas">
            <i class="bi bi-wrench-adjustable-circle-fill text-warning me-1"></i> Panel de Citas del Taller
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menuPrincipal">
            <div class="navbar-nav ms-auto gap-2">
                <a sec:authorize="hasRole('ADMIN')" href="/mecanicos" class="btn btn-sm btn-outline-success d-flex align-items-center gap-1 fw-medium">
                    <i class="bi bi-person-badge-fill"></i> Mecánicos
                </a>
                <a sec:authorize="hasRole('ADMIN')" href="/clientes" class="btn btn-sm btn-outline-info d-flex align-items-center gap-1 fw-medium">
                    <i class="bi bi-person-lines-fill"></i> Clientes
                </a>
                <a sec:authorize="hasRole('ADMIN')" href="/usuarios" class="btn btn-sm btn-outline-warning d-flex align-items-center gap-1 fw-medium">
                    <i class="bi bi-people-fill"></i> Usuarios
                </a>
                <button type="button" class="btn btn-sm btn-outline-light d-flex align-items-center gap-1 fw-medium" data-bs-toggle="modal" data-bs-target="#modalPassword">
                    <i class="bi bi-shield-lock-fill text-warning"></i> Clave
                </button>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 fw-medium">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    </div>

<div class="modal fade" id="modalPassword" tabindex="-1" aria-hidden="true">
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
