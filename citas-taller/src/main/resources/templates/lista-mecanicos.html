<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Mecánicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container px-4">
        <a class="navbar-brand fw-bold fs-4 m-0" href="/citas">
            <i class="bi bi-arrow-return-left text-warning me-1"></i> Volver a Citas
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <div class="navbar-nav ms-auto">
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 fw-medium">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div th:if="${exito}" class="alert alert-success shadow-sm mb-3" th:text="${exito}"></div>
    <div th:if="${error}" class="alert alert-danger shadow-sm mb-3" th:text="${error}"></div>

    <div class="card shadow-sm p-4 bg-white border-0">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mb-4 gap-3">
            <h3 class="fw-bold text-dark d-flex align-items-center gap-2 m-0">
                <i class="bi bi-person-badge-fill text-success"></i> Plantilla de Mecánicos
            </h3>
            <button type="button" class="btn btn-primary fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalMecanico">
                <i class="bi bi-person-plus-fill"></i> Agregar Mecánico
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-dark small">
                    <tr>
                        <th>ID</th><th>Nombre</th><th>Apellido</th><th>Estado</th><th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody class="table-group-divider small">
                    <tr th:each="m : ${mecanicos}">
                        <td th:text="${m.id}" class="fw-bold text-secondary"></td>
                        <td th:text="${m.nombre}"></td>
                        <td th:text="${m.apellido}"></td>
                        <td>
                            <span th:if="${m.disponibilidad == 'Disponible' || m.disponibilidad == 'true'}" class="badge bg-success">Activo</span>
                            <span th:if="${m.disponibilidad == 'No Disponible' || m.disponibilidad == 'false'}" class="badge bg-danger">Ocupado</span>
                        </td>
                        <td class="text-center">
                            <div class="d-flex justify-content-center gap-2">
                                <button type="button" class="btn btn-sm btn-outline-primary btn-editar" 
                                        th:data-id="${m.id}" th:data-nombre="${m.nombre}" th:data-apellido="${m.apellido}" th:data-disponibilidad="${m.disponibilidad}">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                                <a th:href="@{/mecanicos/eliminar/{id}(id=${m.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('¿Seguro?')">
                                    <i class="bi bi-trash3-fill"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalMecanico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">Nuevo Mecánico</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/mecanicos/guardar}" th:object="${mecanico}" method="post">
                <div class="modal-body">
                    <input type="text" th:field="*{nombre}" class="form-control mb-3" placeholder="Nombre" required>
                    <input type="text" th:field="*{apellido}" class="form-control mb-3" placeholder="Apellido" required>
                    <select th:field="*{disponibilidad}" class="form-select"><option value="Disponible">Disponible</option><option value="No Disponible">No Disponible</option></select>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Guardar</button></div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditarMecanico" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-dark text-white"><h5 class="modal-title fw-bold">Editar Mecánico</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <form th:action="@{/mecanicos/actualizar}" method="post">
                <div class="modal-body">
                    <input type="hidden" id="editId" name="id">
                    <input type="text" id="editNombre" name="nombre" class="form-control mb-3" required>
                    <input type="text" id="editApellido" name="apellido" class="form-control mb-3" required>
                    <select id="editDisponibilidad" name="disponibilidad" class="form-select"><option value="Disponible">Disponible</option><option value="No Disponible">No Disponible</option></select>
                </div>
                <div class="modal-footer"><button type="submit" class="btn btn-primary">Guardar Cambios</button></div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll(".btn-editar").forEach(btn => {
        btn.addEventListener("click", () => {
            document.getElementById("editId").value = btn.dataset.id;
            document.getElementById("editNombre").value = btn.dataset.nombre;
            document.getElementById("editApellido").value = btn.dataset.apellido;
            document.getElementById("editDisponibilidad").value = btn.dataset.disponibilidad;
            new bootstrap.Modal(document.getElementById("modalEditarMecanico")).show();
        });
    });
</script>
</body>
</html>
