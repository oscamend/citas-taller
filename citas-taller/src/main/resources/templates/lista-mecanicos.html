<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Mecánicos - Taller</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container px-4">
        <a class="navbar-brand fw-bold fs-4 m-0" href="/citas">
            <i class="bi bi-arrow-return-left text-warning me-1"></i> Volver a Citas
        </a>

        <form th:action="@{/logout}" method="post" class="m-0">
            <button type="submit" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 fw-medium">
                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
            </button>
        </form>
    </div>
</nav>

<div class="container">
    <div th:if="${exito}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i> <span th:text="${exito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill Holiday me-2"></i> <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm p-4 bg-white border-0">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark m-0 d-flex align-items-center gap-2">
                    <i class="bi bi-person-badge-fill" style="color: #0f5132;"></i> Plantilla de Mecánicos Registrados
                </h3>
            </div>
            <button type="button" class="btn btn-primary fw-bold shadow-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modalMecanico">
                <i class="bi bi-person-plus-fill"></i> Agregar Mecánico
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle rounded-3 overflow-hidden m-0">
                <thead class="table-dark small">
                <tr>
                    <th class="ps-3">ID</th>
                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Disponibilidad</th>
                    <th class="text-center">Acciones</th>
                </tr>
                </thead>
                <tbody class="table-group-divider small">
                <tr th:each="m : ${mecanicos}">
                    <td class="ps-3 fw-bold text-secondary" th:text="${m.id}">1</td>
                    <td th:text="${m.nombre}">Juan</td>
                    <td th:text="${m.apellido}">Pérez</td>
                    <td>
                        <span th:if="${m.disponibilidad == 'Disponible' || m.disponibilidad == 'true' || m.disponibilidad == null}" class="badge bg-success">Activo</span>
                        <span th:if="${m.disponibilidad == 'No Disponible' || m.disponibilidad == 'false'}" class="badge bg-danger">Ocupado</span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2 btn-editar"
                                    th:data-id="${m.id}"
                                    th:data-nombre="${m.nombre}"
                                    th:data-apellido="${m.apellido}"
                                    th:data-disponibilidad="${m.disponibilidad}"
                                    title="Editar Mecánico">
                                <i class="bi bi-pencil-square"></i>
                            </button>

                            <a th:href="@{/mecanicos/eliminar/{id}(id=${m.id})}"
                               class="btn btn-sm btn-outline-danger py-0 px-2"
                               onclick="return confirm('¿Seguro que deseas eliminar a este mecánico?');"
                               title="Eliminar Mecánico">
                                <i class="bi bi-trash3-fill"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(mecanicos)}">
                    <td colspan="5" class="text-center py-4 text-muted">
                        <i class="bi bi-info-circle me-1"></i> No hay mecánicos registrados actualmente.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal fade" id="modalMecanico" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-person-badge-fill me-2"></i>Nuevo Mecánico</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/mecanicos/guardar}" th:object="${mecanico}" method="post">
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Nombre</label>
                        <input type="text" th:field="*{nombre}" class="form-control" placeholder="Ej: Carlos" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Apellido</label>
                        <input type="text" th:field="*{apellido}" class="form-control" placeholder="Ej: Mendoza" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Estado Inicial</label>
                        <select th:field="*{disponibilidad}" class="form-select">
                            <option value="Disponible">Disponible / Activo</option>
                            <option value="No Disponible">No Disponible</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4">Guardar Mecánico</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="modalEditarMecanico" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header bg-dark text-white">
                <h5 class="modal-title fw-bold"><i class="bi bi-pencil-square me-2 text-warning"></i>Editar Mecánico</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/mecanicos/actualizar}" method="post">
                <div class="modal-body p-4">
                    <input type="hidden" id="editId" name="id">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Nombre</label>
                        <input type="text" id="editNombre" name="nombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Apellido</label>
                        <input type="text" id="editApellido" name="apellido" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary">Estado / Disponibilidad</label>
                        <select id="editDisponibilidad" name="disponibilidad" class="form-select">
                            <option value="Disponible">Disponible / Activo</option>
                            <option value="No Disponible">No Disponible</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4">Guardar Cambios</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script th:inline="javascript">
    document.addEventListener("DOMContentLoaded", function() {
        const botonesEditar = document.querySelectorAll(".btn-editar");
        const modalEditar = new bootstrap.Modal(document.getElementById("modalEditarMecanico"));

        botonesEditar.forEach(boton => {
            boton.addEventListener("click", function() {
                const id = this.getAttribute("data-id");
                const nombre = this.getAttribute("data-nombre");
                const apellido = this.getAttribute("data-apellido");
                const disponibilidad = this.getAttribute("data-disponibilidad");

                document.getElementById("editId").value = id;
                document.getElementById("editNombre").value = nombre;
                document.getElementById("editApellido").value = apellido;
                document.getElementById("editDisponibilidad").value = disponibilidad;

                modalEditar.show();
            });
        });

        // Leemos la variable booleana de Spring de forma segura en JavaScript
        const debeAbrir = [[${abrirModalError}]];

        // SOLO si es estrictamente true (error real de validación en backend), abrimos el modal
        if (debeAbrir === true) {
            const modalNuevo = new bootstrap.Modal(document.getElementById("modalMecanico"));
            modalNuevo.show();
        }
    });
</script>
</body>
</html>
