<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    
    <title>Acceso al Sistema - TallerMecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            /* Cambiamos min-height por height para evitar desbordamientos en móviles */
            min-height: 100vh; 
            margin: 0;
            padding: 15px; /* Añade un poco de aire en los laterales en móviles */
        }
        .card-login {
            width: 100%;
            max-width: 420px;
            margin: auto;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1e293b;
        }
        /* ... resto de tu CSS igual ... */
        .input-group-text { background-color: #334155; border: 1px solid #475569; color: #94a3b8; }
        .form-control { background-color: #0f172a; border: 1px solid #475569; color: #f8fafc; }
        .form-control:focus { background-color: #0f172a; border-color: #fbbf24; color: #f8fafc; box-shadow: 0 0 0 0.25rem rgba(251, 191, 36, 0.25); }
    </style>
</head>
<body>

<div class="card card-login shadow-lg">
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
