<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Acceso al Sistema - TallerMecánico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0f172a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card-login {
            width: 100%;
            max-width: 420px;
            margin: auto;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            background-color: #1e293b;
        }
        .input-group-text {
            background-color: #334155;
            border: 1px solid #475569;
            color: #94a3b8;
        }
        .form-control {
            background-color: #0f172a;
            border: 1px solid #475569;
            color: #f8fafc;
        }
        .form-control:focus {
            background-color: #0f172a;
            border-color: #fbbf24;
            color: #f8fafc;
            box-shadow: 0 0 0 0.25rem rgba(251, 191, 36, 0.25);
        }
        .form-control::placeholder {
            color: #475569;
        }
    </style>
</head>
<body>

<div class="card card-login shadow-lg">
    <div class="card-header border-0 text-center py-4" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
        <div class="mb-2">
            <i class="bi bi-wrench-adjustable-circle-fill text-warning" style="font-size: 3rem;"></i>
        </div>
        <h4 class="text-white fw-bold m-0 tracking-wide" style="letter-spacing: 1px;">Taller Mecánico</h4>
        <span class="text-secondary small">Panel de Control y Gestión</span>
    </div>

    <div class="card-body p-4">

        <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center gap-2 border-0 shadow-sm py-2" style="background-color: #ef4444; color: white;">
            <i class="bi bi-exclamation-triangle-fill"></i>
            <small class="fw-medium">Usuario o contraseña incorrectos.</small>
        </div>

        <form th:action="@{/login}" method="post" class="mt-2">
            <div class="mb-3">
                <label class="form-label small fw-semibold text-secondary mb-1">Nombre de Usuario</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
                    <input type="text" name="username" class="form-control" required placeholder="Introduce tu usuario" autocomplete="off">
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-semibold text-secondary mb-1">Contraseña del Sistema</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" name="password" class="form-control" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm d-flex align-items-center justify-content-center gap-2">
                <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
            </button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
