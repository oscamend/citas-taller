<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
    <div class="container px-4">
        <a class="navbar-brand fw-bold fs-4 m-0" href="/citas">
            <i class="bi bi-arrow-return-left text-warning me-1"></i> Volver a Citas
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <div class="navbar-nav ms-auto">
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1 fw-medium">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm p-4 bg-white border-0 mb-4">
        <div class="d-flex flex-column flex-sm-row justify-content-between align-items-center mb-4 gap-3">
            <h3 class="fw-bold text-dark d-flex align-items-center gap-2 m-0">
                <i class="bi bi-people-fill text-info"></i> Base de Datos de Clientes
            </h3>
            <button type="button" class="btn btn-primary fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCliente">
                <i class="bi bi-person-plus-fill"></i> Agregar Cliente
            </button>
        </div>

        <form th:action="@{/clientes}" method="get" class="row g-3 align-items-end">
            <div class="col-md-4">
                <label class="form-label small fw-bold text-secondary">DNI / NIE</label>
                <input type="text" name="dni" th:value="${paramDni}" class="form-control" placeholder="Ej: 12345678X">
            </div>
            <div class="col-md-4">
                <label class="form-label small fw-bold text-secondary">Teléfono</label>
                <input type="text" name="telefono" th:value="${paramTelefono}" class="form-control" placeholder="Ej: 600000000">
            </div>
            <div class="col-md-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary flex-grow-1 fw-bold"><i class="bi bi-search"></i> Buscar</button>
                <a th:href="@{/clientes}" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise"></i></a>
            </div>
        </form>
    </div>

    <div th:if="${errorEliminacion}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <i class="bi bi-exclamation-triangle-fill me-2"></i>
    <span th:text="${errorEliminacion}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
</div>

    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-hover align-middle m-0">
            <thead class="table-dark small">
                <tr>
                    <th>ID</th><th>Nombre</th><th>Apellido</th><th>DNI</th><th>Teléfono</th>
                    <th sec:authorize="hasRole('ADMIN')" class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cliente : ${clientes}">
                    <td th:text="${cliente.id}" class="fw-bold text-secondary"></td>
                    <td th:text="${cliente.nombre}"></td>
                    <td th:text="${cliente.apellido}"></td>
                    <td><span class="badge bg-light text-dark border font-monospace" th:text="${cliente.dni}"></span></td>
                    <td th:text="${cliente.telefono != null ? cliente.telefono : 'No registrado'}"></td>
                    <td sec:authorize="hasRole('ADMIN')" class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil-square"></i></a>
                            <form th:action="@{/clientes/eliminar/{id}(id=${cliente.id})}" method="post" class="d-inline" onsubmit="return confirm('¿Seguro que quieres eliminar este cliente?')">
    <button type="submit" class="btn btn-sm btn-outline-danger">
        <i class="bi bi-trash3-fill"></i>
    </button>
</form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="modalCliente" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title fw-bold">Nuevo Cliente</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
                <div class="modal-body">
                    <input type="text" th:field="*{nombre}" class="form-control mb-3" placeholder="Nombre" required>
                    <input type="text" th:field="*{apellido}" class="form-control mb-3" placeholder="Apellido" required>
                    <input type="text" th:field="*{dni}" class="form-control mb-3" placeholder="DNI" required>
                    <input type="tel" th:field="*{telefono}" class="form-control" placeholder="Teléfono">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Guardar Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
