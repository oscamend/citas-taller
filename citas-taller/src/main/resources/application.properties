spring.application.name=citas-taller

# Configuración de conexión a la base de datos de XAMPP
spring.datasource.url=jdbc:mysql://acela.proxy.rlwy.net:20377/railway
spring.datasource.username=root
spring.datasource.password=REMOVED_CREDENTIAL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA / Hibernate
# 'update' creará las tablas automáticamente en tu MySQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=9090

logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG